name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run default tests
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Verify default test report
        if: always()
        run: python3 scripts/check-test-reports.py target/surefire-reports EventOrderServiceTest EventPaymentServiceTest EventNotificationControllerTest SecurityRegressionTest

  infrastructure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Testcontainers integration tests
        run: mvn --batch-mode --no-transfer-progress clean -Pinfrastructure verify
      - name: Verify integration test report
        if: always()
        run: python3 scripts/check-test-reports.py target/failsafe-reports EventInfrastructureIT EventOrderLifecycleIT EventNotificationIT PaymentBoundaryIT
