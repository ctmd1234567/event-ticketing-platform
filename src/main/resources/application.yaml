server:
  port: 8081
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:300}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    connection-timeout: 5s
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import: optional:file:.env[.properties]
  application:
    name: event-trading-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/event_trading?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:32}
      minimum-idle: ${DB_POOL_MIN_IDLE:16}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          time-between-eviction-runs: 10s
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    # Existing local databases were created by the archived bootstrap/upgrade scripts.
    # Adopt that schema at version 2, then apply the event-catalog migration.
    baseline-on-migrate: true
    baseline-version: 2
    clean-disabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:event_app}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: 1
        max-concurrency: 2
        prefetch: 10
  jackson:
    default-property-inclusion: non_null
management:
  server:
    port: ${MANAGEMENT_PORT:8082}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
mybatis-plus:
  type-aliases-package: com.eventplatform.entity
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    com.eventplatform: info
app:
  event-orders:
    payment-window-seconds: ${EVENT_ORDER_PAYMENT_WINDOW_SECONDS:900}
    expiry-scan-enabled: ${EVENT_ORDER_EXPIRY_SCAN_ENABLED:true}
    expiry-scan-interval-ms: ${EVENT_ORDER_EXPIRY_SCAN_INTERVAL_MS:1000}
    expiry-scan-batch-size: ${EVENT_ORDER_EXPIRY_SCAN_BATCH_SIZE:200}
    expiry-failure-retry-seconds: ${EVENT_ORDER_EXPIRY_FAILURE_RETRY_SECONDS:30}
  simulated-gateway:
    payment-status: ${SIM_GATEWAY_PAYMENT_STATUS:SUCCEEDED}
    refund-status: ${SIM_GATEWAY_REFUND_STATUS:SUCCEEDED}
    fault-after-commit-once: ${SIM_GATEWAY_FAULT_AFTER_COMMIT_ONCE:NONE}
    # Intentionally empty by default: callbacks are unavailable until an operator supplies a secret.
    callback-secret: ${SIM_GATEWAY_CALLBACK_SECRET:}
    callback-freshness-seconds: ${SIM_GATEWAY_CALLBACK_FRESHNESS_SECONDS:300}
  payment-recovery:
    enabled: ${PAYMENT_RECOVERY_ENABLED:true}
    interval-ms: ${PAYMENT_RECOVERY_INTERVAL_MS:1000}
    batch-size: ${PAYMENT_RECOVERY_BATCH_SIZE:100}
  security:
    admin-user-ids: ${ADMIN_USER_IDS:}
    session-ttl-seconds: ${SESSION_TTL_SECONDS:1800}
    session-refresh-threshold-seconds: ${SESSION_REFRESH_THRESHOLD_SECONDS:900}
  sms:
    mode: ${SMS_MODE:disabled}
    endpoint: ${SMS_ENDPOINT:}
    api-key: ${SMS_API_KEY:}
  order:
    stock-bucket-count: ${ORDER_STOCK_BUCKET_COUNT:16}
    max-in-flight: ${ORDER_MAX_IN_FLIGHT:24}
    admission-wait-ms: ${ORDER_ADMISSION_WAIT_MS:100}
    rate-limit:
      user-max: ${ORDER_USER_RATE_MAX:10}
      user-window-seconds: ${ORDER_USER_RATE_WINDOW_SECONDS:10}
      voucher-max: ${ORDER_VOUCHER_RATE_MAX:420}
      voucher-window-seconds: ${ORDER_VOUCHER_RATE_WINDOW_SECONDS:1}
      global-max: ${ORDER_GLOBAL_RATE_MAX:800}
      global-window-seconds: ${ORDER_GLOBAL_RATE_WINDOW_SECONDS:1}
  event-notifications:
    # Broker outage never blocks transaction commits; intents remain in MySQL.
    enabled: ${EVENT_NOTIFICATIONS_ENABLED:true}
    interval-ms: ${EVENT_NOTIFICATIONS_INTERVAL_MS:1000}
    batch-size: ${EVENT_NOTIFICATIONS_BATCH_SIZE:50}
    lease-seconds: ${EVENT_NOTIFICATIONS_LEASE_SECONDS:30}
    max-attempts: ${EVENT_NOTIFICATIONS_MAX_ATTEMPTS:8}
    confirm-timeout-seconds: ${EVENT_NOTIFICATIONS_CONFIRM_TIMEOUT_SECONDS:5}
  outbox:
    enabled: false
    interval-ms: ${OUTBOX_INTERVAL_MS:50}
    batch-size: ${OUTBOX_BATCH_SIZE:500}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    confirm-timeout-seconds: ${OUTBOX_CONFIRM_TIMEOUT_SECONDS:5}
